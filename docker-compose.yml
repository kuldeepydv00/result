version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: satta-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: satta-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/satta-king
      - JWT_SECRET=some-very-secret-key-1234567890
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=Admin@123
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: satta-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
